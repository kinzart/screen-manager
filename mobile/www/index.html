<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>FBS Screen Manager — Mobile</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="./styles/app.css" />
  <link rel="stylesheet" href="./styles/components.css" />
  <link rel="stylesheet" href="./styles/screens.css" />
  <link rel="stylesheet" href="./styles/presenter.css" />
</head>
<body>
  <div id="boot-loading" class="boot-loading" role="status">
    <p>Carregando…</p>
  </div>

  <div id="boot-error" class="boot-error" role="alert" hidden>
    <p id="boot-error-message"></p>
    <button id="boot-retry" type="button">Tentar novamente</button>
  </div>

  <div id="app-root" class="app-root" hidden></div>

  <div id="confirm-modal" class="confirm-modal" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="confirm-modal-box">
      <p id="confirm-modal-title"></p>
      <div class="confirm-modal-actions">
        <button id="confirm-modal-cancel" type="button">Cancelar</button>
        <button id="confirm-modal-confirm" type="button">Remover</button>
      </div>
    </div>
  </div>

  <script type="module" src="./app/main.js"></script>
</body>
</html>
