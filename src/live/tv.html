<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <title>FBS · Saída de palco</title>
  <link rel="manifest" href="/tv.webmanifest">
  <link rel="apple-touch-icon" href="/live/icon-192.png">
  <link rel="stylesheet" href="/live/live.css">
  <link rel="stylesheet" href="/display.css">
  <script src="/live/client.js" defer></script>
  <script src="/display.js" defer></script>
</head>
<body data-role="tv">
  <section id="pairPanel" class="pair-panel" aria-labelledby="pairTitle">
    <p class="eyebrow">FBS · Saída de palco</p>
    <h1 id="pairTitle">Conecte esta tela.</h1>
    <p id="pairHelp" class="muted">Digite os oito dígitos do código gerado no computador. Use OK para confirmar.</p>
    <form id="pairForm" class="pair-form" method="post">
      <label for="pairCode">Código de pareamento</label>
      <input id="pairCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{8}" minlength="8" maxlength="8" enterkeyhint="go" autocapitalize="off" spellcheck="false" aria-describedby="pairHelp pairError" required>
      <button type="submit" class="primary">Conectar</button>
      <p id="pairError" class="error-text" role="status" aria-live="polite" aria-atomic="true"></p>
    </form>
    <p id="netStatus" class="net-status" role="status" aria-live="polite">Aguardando conexão</p>
  </section>

  <main id="session" aria-label="Saída de palco" hidden>
    <div id="stage">
      <img id="logo" class="logo" src="/logo-bs.png" alt="Logo FBS" draggable="false">
    </div>
    <button id="fullscreen" type="button" aria-label="Ativar tela cheia" title="Ativar tela cheia com toque ou OK">Tela cheia</button>
  </main>
</body>
</html>
