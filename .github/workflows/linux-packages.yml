name: Linux packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage and Debian package
        run: npm run package:linux -- --config.directories.output=dist/linux

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fbs-screen-manager-linux
          path: |
            dist/linux/*.AppImage
            dist/linux/*.deb
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/linux/*.AppImage dist/linux/*.deb --title "FBS Screen Manager $GITHUB_REF_NAME" --generate-notes
